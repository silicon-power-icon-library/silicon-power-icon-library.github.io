        Object.values(currentDatabase).forEach(sections => {
          sections.forEach(section => {
            section.icons.forEach(icon => {
              const matchZHTW = icon.name.toLowerCase().includes(searchQuery.toLowerCase());
              const matchEN = icon.enName && icon.enName.toLowerCase().includes(searchQuery.toLowerCase());
              
              if (matchZHTW || matchEN) {
                if (!seenNames.has(icon.name)) {
                  seenNames.add(icon.name);
                  globalSearchResults.push(icon);
                }
              }
            });
          });
        });
      }

      const currentCategoryData = currentCategories.find(c => c.id === currentView);
      const innerSections = currentDatabase[currentView] || [];

      // 區分 PNG 與 GIF 類別以進行排版
      const pngCategories = currentCategories.filter(c => !c.id.includes('gif'));
      const gifCategories = currentCategories.filter(c => c.id.includes('gif'));

      return (
        <div className="min-h-screen bg-white font-sans text-gray-900 transition-colors duration-300 flex flex-col">
          <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200">
            <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                {(currentView !== 'home' || isSearching) && (
                  <button 
                    onClick={() => navigateTo('home')}
                    className="p-2 -ml-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors"
                    title="回首頁"
                  >
                    <ArrowLeftIcon size={20} />
                  </button>
                )}
                <h1 
                  className="text-lg font-bold tracking-tight cursor-pointer flex items-center gap-2"
                  onClick={() => navigateTo('home')}
                >
                  <img src="https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/logo/spec.png" alt="SP Logo" className="h-8 w-auto object-contain" />
                  Icon Library
                </h1>
              </div>

              <div className="flex-1 max-w-md relative">
                <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={18} />
                <input
                  type="text"
                  placeholder={iconLang === 'en' ? `Search in ${activeTab === 'product' ? 'Product Specs' : 'Brand Identity'}...` : `在 ${activeTab === 'product' ? '產品規格' : '品牌視覺'} 中搜尋圖示`}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className={`w-full pl-10 pr-4 py-2 bg-gray-100 border-transparent focus:bg-white rounded-full text-sm transition-all outline-none focus:ring-2 ${theme.searchRing}`}
                />
              </div>

              {/* 將中英文切換按鈕移至全域的 Header 內 */}
              <div className="flex bg-gray-100 p-1 rounded-lg shrink-0">
                <button
                  onClick={() => setIconLang('zh')}
                  className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${
                    iconLang === 'zh' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'
                  }`}
                >
                  CH
                </button>
                <button
                  onClick={() => setIconLang('en')}
                  className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${
                    iconLang === 'en' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'
                  }`}
                >
                  EN
                </button>
              </div>

            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 py-8">
            
            {/* === 視圖 0：全局搜尋結果 === */}
            {isSearching ? (
              <div className="animate-fade-in w-full pt-2">
                <div className="mb-8 pb-4 border-b border-gray-100 flex items-center justify-between">
                  <h2 className="text-2xl font-bold">
                    {iconLang === 'en' ? `Search Results: ${searchQuery}` : `搜尋結果：${searchQuery}`}
                  </h2>
                  <span className="text-gray-500 text-sm bg-gray-100 px-3 py-1 rounded-full">
                    {iconLang === 'en' ? `Found ${globalSearchResults.length} icons` : `找到 ${globalSearchResults.length} 個圖示`}
                  </span>
                </div>
                
                {globalSearchResults.length > 0 ? (
                  <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-2">
                    {globalSearchResults.map((icon, index) => (
                      <IconCell key={index} iconData={icon} theme={theme} language={iconLang} />
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-32 text-gray-500">
                    <Search size={48} className="mx-auto mb-4 opacity-20" />
                    <p>{iconLang === 'en' ? `No icons found matching "${searchQuery}"` : `找不到符合「${searchQuery}」的圖示`}</p>
                    <button 
                      onClick={() => setSearchQuery('')}
                      className="mt-6 px-6 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-sm font-medium transition-colors"
                    >
                      {iconLang === 'en' ? 'Clear Search' : '清除搜尋'}
                    </button>
                  </div>
                )}
              </div>
            ) : 
            
            /* === 視圖 1：首頁分類 === */
            currentView === 'home' ? (
              <div className="animate-fade-in">
                <div className="mb-10 text-center max-w-2xl mx-auto pt-6">
                <div className="mb-10">
                    <span className="text-xl sm:text-2xl font-semibold text-gray-950 tracking-wide">
                      {iconLang === 'en' ? 'Start browsing icons by category.' : '開始依分類瀏覽圖示。'}
                    </span>
                  </div>
                  <div className="inline-flex bg-gray-100 p-1 rounded-full relative">
                    <button
                      onClick={() => handleTabSwitch('product')}
                      className={`relative z-10 px-8 py-2.5 rounded-full text-sm font-bold transition-all duration-300 ${
                        activeTab === 'product'
                          ? 'bg-gray-900 text-white shadow-md'
                          : 'text-gray-500 hover:text-blue-600 hover:bg-gray-200/50'
                      }`}
                    >
                      {iconLang === 'en' ? 'Product Specs' : '產品規格專區'}
                    </button>
                    <button
                      onClick={() => handleTabSwitch('brand')}
                      className={`relative z-10 px-8 py-2.5 rounded-full text-sm font-bold transition-all duration-300 ${
                        activeTab === 'brand'
                          ? 'bg-gray-900 text-white shadow-md'
                          : 'text-gray-500 hover:text-[#ee3d85] hover:bg-gray-200/50'
                      }`}
                    >
                      {iconLang === 'en' ? 'Brand Identity' : '品牌識別專區'}
                    </button>
                  </div>
                  <p className="text-gray-500 mt-5 text-sm font-medium tracking-wide">
                    {activeTab === 'product' 
                      ? (iconLang === 'en' ? 'Product visuals, technical spec sheets...' : '產品相關視覺、技術規格表…') 
                      : (iconLang === 'en' ? 'Official website, e-commerce, official LINE...' : '官網、品牌購物網、官方Line平台…')}
                  </p>
                </div>

                {activeTab === 'product' ? (
                  <div className="w-full max-w-7xl mx-auto animate-fade-in" key="product-grid">
                    {/* PNG Icons 區塊 */}
                    <div className="w-full mb-6 mt-4 flex items-center gap-4">
                      <h2 className="text-xl font-bold text-gray-800 tracking-wider uppercase">PNG ICONS</h2>
                      <div className="h-[2px] bg-gray-100 flex-1"></div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                      {pngCategories.map(renderCategoryCard)}
                    </div>

                    {/* GIF Icons 區塊 */}
                    <div className="w-full mb-6 flex items-center gap-4">
                      <h2 className="text-xl font-bold text-gray-800 tracking-wider uppercase">GIF ICONS</h2>
                      <div className="h-[2px] bg-gray-100 flex-1"></div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                      {gifCategories.map(renderCategoryCard)}
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-7xl mx-auto animate-fade-in" key="brand-grid">
                    {currentCategories.map(renderCategoryCard)}
                  </div>
                )}
              </div>
            ) : 
            
            /* === 視圖 2：內頁 === */
            (
              <div className="flex flex-col md:flex-row gap-10 animate-fade-in w-full">
                
                <aside className="w-full md:w-56 shrink-0 hidden md:block">
                  <div className="sticky top-24">
                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">
                      {activeTab === 'product' 
                        ? (iconLang === 'en' ? 'Product Categories' : '產品規格分類') 
                        : (iconLang === 'en' ? 'Brand Categories' : '品牌視覺分類')}
                    </h3>
                    <nav className="flex flex-col space-y-3">
                      {currentCategories.map((cat) => (
                        <div key={cat.id}>
                          <button
                            onClick={() => navigateTo(cat.id)}
                            className={`w-full text-left px-3 py-2.5 rounded-lg transition-colors font-medium text-sm flex items-center justify-between ${
                              currentView === cat.id 
                                ? theme.sidebarActive 
                                : `text-gray-600 hover:text-black hover:bg-gray-50`
                            }`}
                          >
                            <span>{iconLang === 'en' && cat.enTitle ? cat.enTitle : cat.title}</span>
                          </button>
                          
                          {currentView === cat.id && innerSections.length > 0 && (
                            <div className={`ml-3 mt-2 pl-3 border-l-2 flex flex-col space-y-2 ${theme.sidebarBorder}`}>
                              {innerSections.map((section) => {
                                const sectionName = iconLang === 'en' && section.enSection ? section.enSection : section.section;
                                return (
                                  <a
                                    key={section.id}
                                    href={`#${section.id}`}
                                    className={`text-xs font-medium text-gray-500 px-3 py-2 rounded-md transition-colors block ${theme.sidebarHover}`}
                                  >
                                    {sectionName}
                                  </a>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      ))}
                    </nav>
                  </div>
                </aside>

                <div className="flex-1 min-w-0">
                  {currentCategoryData && (
                    <React.Fragment>
                      {/* 移除內頁專屬的語言切換按鈕，保留分類標題 */}
                      <div className="sticky top-16 z-30 bg-white/95 backdrop-blur-sm py-4 mb-6 border-b border-gray-100 flex items-center justify-between">
                        <h2 className="text-xl font-bold">
                          {iconLang === 'en' && currentCategoryData.enTitle ? currentCategoryData.enTitle : currentCategoryData.title}
                        </h2>
                      </div>

                      {innerSections.map((section) => (
                        <section key={section.id} id={section.id} className="mb-10 scroll-mt-36">
                          <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-6 pb-2 border-b-2 border-gray-200 flex items-center gap-2">
                            {iconLang === 'en' && section.enSection ? section.enSection : section.section}
                            <span className="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full text-[10px]">{section.icons.length}</span>
                          </h3>
                          
                          <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-2">
                            {section.icons.map((icon, index) => (
                              <IconCell key={index} iconData={icon} theme={theme} language={iconLang} />
                            ))}
                          </div>
                        </section>
                      ))}
                    </React.Fragment>
                  )}
                </div>
              </div>
            )}
          </main>
  <footer className="w-full bg-gray-400 py-2 mt-auto">
            <div className="max-w-7xl mx-auto px-6 text-center text-white text-[11px] tracking-wider">
              {iconLang === 'en' ? 'Last Updated: April 2, 2026' : '最後更新日期：2026.07.31'}
            </div>
          </footer>
        </div>
      );
    }

    // 渲染 App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
